server:
  port: 8086
  tomcat:
    threads:
      max: 50 # 允许的最大线程数
    accept-count: 50 # 最大排队等待数量
    max-connections: 100 # 允许的最大连接
spring:
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 5s
        default-requeue-rejected: false
  sentinel:
    transport:
      dashboard: localhost:8090
    http-method-specify: true
feign:
  okhttp:
    enabled: true
  main:
    allow-circular-references: true
  sentinel:
    enabled: false
hm:
  jwt:
    location: "${JWT_KEYSTORE_LOCATION:file:./dev-secrets/hmall.jks}"
    alias: hmall
    password: "${JWT_KEYSTORE_PASSWORD:}"
    tokenTTL: 30m
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi
  swagger:
    title: 购物车服务接口文档
    package: com.hmall.trade.controller
  db:
    database: hm-trade
# keytool -genkeypair -alias hmall -keyalg RSA -keypass hmall123 -keystore hmall.jks -storepass hmall123
